<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Contact</title>

		<link rel="stylesheet" href="./css/style.css" />
		<link rel="stylesheet" href="./css/modal.css" />
		<link rel="stylesheet" href="./css/contact.css" />
		<link rel="stylesheet" href="./css/game-ui.css" />
	</head>

	<body data-page="contact">
		<div id="header"></div>

		<img src="./assets/background.png" alt="" class="background" />

		<main>
			<div class="contact-container">
				<div class="contact-panel">
					<h1>Contact</h1>
					<form class="contact-form" id="contact-form" novalidate>
						<div class="form-group">
							<label for="name">Name</label>
							<input type="text" id="name" name="name" />
							<p class="error-message" id="name-error"></p>
						</div>

						<div class="form-group">
							<label for="email">Email</label>
							<input type="email" id="email" name="email" />
							<p class="error-message" id="email-error"></p>
						</div>

						<div class="form-group">
							<label for="subject">Subject</label>
							<input type="text" id="subject" name="subject" />
							<p class="error-message" id="subject-error"></p>
						</div>

						<div class="form-group">
							<label for="message">Message</label>
							<textarea id="message" name="message"></textarea>
							<p class="error-message" id="message-error"></p>
						</div>

						<button type="submit">SEND</button>
					</form>
				</div>
			</div>
		</main>

		<div class="modal" id="contact-success">
			<div class="modal-content">
				<h2>MESSAGE SENT</h2>

				<p>
					Thank you for your message.
					<br />
					I'll get back to you as soon as possible.
				</p>

				<div class="modal-links">
					<button type="button" id="success-close">CLOSE</button>
				</div>
			</div>
		</div>

		<div class="modal" id="contact-error">
			<div class="modal-content">
				<h2>FAILED TO SEND</h2>

				<p>
					Something went wrong.<br />
					Please try again.
				</p>

				<div class="modal-links">
					<button type="button">RETRY</button>
				</div>
			</div>
		</div>

		<div id="footer"></div>

		<script src="./js/layout.js"></script>
		<script src="./js/modal.js"></script>
		<script src="./js/contact.js"></script>
	</body>
</html>
